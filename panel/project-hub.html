<title>项目总控台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
/* Layout: two views on one desk. "今天" = today's list across every company, grouped by company,
   with the next three days and today's finished items beside it. "全部公司" = every company as a
   card (stage, my role, milestone, to-dos) plus one merged to-do list. Phones stack to one column. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --surface-2: #f6f8fa;
  --ink: #16202a;
  --muted: #5b6875;
  --faint: #8a96a3;
  --line: #d9dfe5;
  --accent: #2a45c9;
  --accent-soft: #e3e8fb;
  --on-accent: #ffffff;

  --ok: #1f7a4d;     --ok-soft: #e1f2e8;
  --risk: #a05d00;   --risk-soft: #fbeed8;
  --bad: #b42335;    --bad-soft: #fbe3e6;

  --r-lead: #2a45c9;     --r-lead-soft: #e3e8fb;
  --r-partner: #7a3db8;  --r-partner-soft: #efe5f9;
  --r-advisor: #9a5a12;  --r-advisor-soft: #f7ebdc;
  --r-exec: #0f7472;     --r-exec-soft: #dcf1f0;
  --r-investor: #3d7a1c; --r-investor-soft: #e6f2dc;
  --r-support: #5b6875;  --r-support-soft: #e8ecf0;

  --f-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --radius: 10px;
  --shadow: 0 1px 2px rgba(22, 32, 42, .06), 0 4px 16px rgba(22, 32, 42, .05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1319; --surface: #161d25; --surface-2: #1b232c; --ink: #e5eaef; --muted: #9aa6b2; --faint: #6f7c88; --line: #28323d;
    --accent: #8197ff; --accent-soft: #232c52; --on-accent: #0e1319;
    --ok: #5cc98f; --ok-soft: #173326; --risk: #f0b45a; --risk-soft: #3a2a12; --bad: #ff7d8c; --bad-soft: #3d1a20;
    --r-lead: #8197ff; --r-lead-soft: #232c52; --r-partner: #c39af0; --r-partner-soft: #33244a; --r-advisor: #e7b06a; --r-advisor-soft: #3a2b18;
    --r-exec: #5fd0cc; --r-exec-soft: #15363a; --r-investor: #95d46c; --r-investor-soft: #22341a; --r-support: #a7b2bd; --r-support-soft: #262f38;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1319; --surface: #161d25; --surface-2: #1b232c; --ink: #e5eaef; --muted: #9aa6b2; --faint: #6f7c88; --line: #28323d;
  --accent: #8197ff; --accent-soft: #232c52; --on-accent: #0e1319;
  --ok: #5cc98f; --ok-soft: #173326; --risk: #f0b45a; --risk-soft: #3a2a12; --bad: #ff7d8c; --bad-soft: #3d1a20;
  --r-lead: #8197ff; --r-lead-soft: #232c52; --r-partner: #c39af0; --r-partner-soft: #33244a; --r-advisor: #e7b06a; --r-advisor-soft: #3a2b18;
  --r-exec: #5fd0cc; --r-exec-soft: #15363a; --r-investor: #95d46c; --r-investor-soft: #22341a; --r-support: #a7b2bd; --r-support-soft: #262f38;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 14px;
  line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 20px; }
.view { display: grid; gap: 20px; }

/* ---------- top bar ---------- */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; }
.top h1 { font-family: var(--f-display); font-size: 28px; line-height: 1.2; margin: 0; letter-spacing: .02em; text-wrap: balance; }
.top .date { color: var(--muted); margin: 4px 0 0; }
.top-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); }
.tabs button { border: 0; background: transparent; padding: 7px 16px; color: var(--muted); font-weight: 500; }
.tabs button + button { border-left: 1px solid var(--line); }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  padding: 7px 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn:disabled { opacity: .55; cursor: default; }
.badge-ro { font-size: 12px; color: var(--muted); border: 1px dashed var(--line); border-radius: 999px; padding: 2px 10px; }

/* ---------- today view ---------- */
.today-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 28px; }
.bigdate { display: flex; align-items: flex-end; gap: 12px; }
.bigdate .d { font-family: var(--f-display); font-size: 56px; line-height: .9; font-weight: 700; font-variant-numeric: tabular-nums; }
.bigdate .m { display: grid; line-height: 1.3; padding-bottom: 2px; }
.bigdate .m b { font-size: 16px; }
.bigdate .m span { color: var(--muted); font-size: 13px; }
.tcount { display: flex; gap: 18px; flex-wrap: wrap; padding-bottom: 4px; }
.tcount .c { display: grid; }
.tcount .c .n { font-family: var(--f-mono); font-size: 22px; font-weight: 500; line-height: 1.1; }
.tcount .c .l { color: var(--muted); font-size: 12px; }
.tcount .c.alert .n { color: var(--bad); }
.tcount .c.good .n { color: var(--ok); }

.ms-strip { display: flex; flex-wrap: wrap; gap: 8px; }
.ms-chip { display: inline-flex; gap: 8px; align-items: baseline; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: 13px; min-width: 0; max-width: 100%; }
.ms-chip .who { font-weight: 700; color: var(--rc); }
.ms-chip .what { overflow-wrap: anywhere; }
.ms-chip .when { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.ms-chip .when.soon { color: var(--risk); }
.ms-chip .when.late { color: var(--bad); }

.today-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.today-main { display: grid; gap: 14px; min-width: 0; }
.tblock { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.tblock-h { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tblock-h .name { font-family: var(--f-display); font-size: 17px; font-weight: 700; }
.tblock-h .rtag { font-size: 12px; font-weight: 700; color: var(--rc); background: var(--rs); border-radius: 4px; padding: 1px 7px; letter-spacing: .04em; }
.tblock-h .cnt { margin-left: auto; font-family: var(--f-mono); font-size: 12px; color: var(--faint); }
.tlist { list-style: none; margin: 0; padding: 4px 16px 8px; display: grid; }
.trow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 10px; align-items: start; padding: 9px 0; }
.trow + .trow { border-top: 1px solid var(--line); }
.trow input { margin: 4px 0 0; accent-color: var(--accent); width: 17px; height: 17px; }
.trow label { cursor: pointer; font-size: 15px; overflow-wrap: anywhere; }
.trow .due { padding-top: 3px; }
.mini { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; font-size: 12px; padding: 1px 8px; color: var(--muted); white-space: nowrap; }
.mini:hover { color: var(--accent); border-color: var(--accent); }
.pin { font-size: 11px; color: var(--accent); white-space: nowrap; padding-top: 3px; }

.today-empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); padding: 24px 22px; display: grid; gap: 6px; }
.today-empty h3 { margin: 0; font-family: var(--f-display); font-size: 18px; }
.today-empty p { margin: 0; color: var(--muted); }

.tquick { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; display: grid; grid-template-columns: minmax(0, 1fr) 160px auto; gap: 8px; align-items: center; }
.tquick h3 { grid-column: 1 / -1; margin: 0; font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: .04em; }

.side { display: grid; gap: 14px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
.panel-h { padding: 12px 16px 6px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.panel-h h2 { margin: 0; font-size: 14px; }
.panel-h .cnt { font-family: var(--f-mono); font-size: 12px; color: var(--faint); }
.slist { list-style: none; margin: 0; padding: 0 16px 10px; display: grid; }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 7px 0; align-items: start; }
.srow + .srow { border-top: 1px solid var(--line); }
.srow .t { font-size: 13px; overflow-wrap: anywhere; }
.srow .meta { display: flex; gap: 8px; align-items: center; margin-top: 2px; flex-wrap: wrap; }
.drow { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; padding: 6px 0; align-items: start; }
.drow + .drow { border-top: 1px solid var(--line); }
.drow input { margin: 3px 0 0; accent-color: var(--accent); width: 15px; height: 15px; }
.drow label { font-size: 13px; color: var(--faint); text-decoration: line-through; cursor: pointer; overflow-wrap: anywhere; }
.slist .none { color: var(--faint); font-size: 13px; padding: 2px 0 6px; }

/* ---------- summary (all view) ---------- */
.summary {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 0;
}
.sum-stats { display: flex; flex-wrap: wrap; }
.stat { padding: 14px 18px; display: grid; gap: 2px; min-width: 110px; flex: 1 1 110px; }
.stat + .stat { border-left: 1px solid var(--line); }
.stat .n { font-family: var(--f-mono); font-size: 24px; font-weight: 500; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .l { color: var(--muted); font-size: 12px; letter-spacing: .04em; }
.stat .sub { color: var(--faint); font-size: 12px; }
.stat.alert .n { color: var(--bad); }
.roles { border-left: 1px solid var(--line); padding: 14px 18px; display: grid; gap: 8px; align-content: center; min-width: 0; }
.roles h2 { margin: 0; font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: .04em; }
.rolebar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--surface-2); gap: 2px; }
.rolebar span { display: block; height: 100%; }
.rolekeys { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; }
.rolekeys .k { display: inline-flex; align-items: center; gap: 6px; }
.rolekeys .dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.rolekeys b { font-family: var(--f-mono); font-weight: 500; }

/* ---------- all view grid ---------- */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 5px 12px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.toggle { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
.toolbar .lbl { color: var(--muted); font-size: 13px; margin-right: 6px; }

.group { display: grid; gap: 10px; }
.group + .group { margin-top: 22px; }
.group-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.group-h h3 { margin: 0; font-size: 15px; font-weight: 700; }
.group-h .cnt { font-family: var(--f-mono); color: var(--faint); font-size: 13px; }
.group-h .hint { color: var(--faint); font-size: 12px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }

/* ---------- company card ---------- */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px 16px 12px; display: grid; gap: 12px; align-content: start; min-width: 0;
  box-shadow: var(--shadow);
}
.card.is-done, .card.is-paused { box-shadow: none; background: var(--surface-2); }
.card-h { display: grid; gap: 2px; min-width: 0; }
.card-title { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.pname {
  font-family: var(--f-display); font-size: 18px; font-weight: 700; line-height: 1.3;
  border: 0; background: none; padding: 0; text-align: left; color: var(--ink); min-width: 0; overflow-wrap: anywhere;
}
.pname:hover { color: var(--accent); }
.tagline { margin: 0; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.pill { font-size: 12px; border-radius: 999px; padding: 1px 9px; white-space: nowrap; font-weight: 500; flex: none; }
.h-ok { color: var(--ok); background: var(--ok-soft); }
.h-risk { color: var(--risk); background: var(--risk-soft); }
.h-blocked { color: var(--bad); background: var(--bad-soft); }

.role { display: grid; gap: 4px; padding: 10px 12px; border-radius: 8px; background: var(--rs); min-width: 0; }
.role-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.role-type { font-size: 12px; font-weight: 700; color: var(--rc); letter-spacing: .06em; }
.role-name { font-weight: 500; overflow-wrap: anywhere; }
.role-note { margin: 0; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.role-lead { --rc: var(--r-lead); --rs: var(--r-lead-soft); }
.role-partner { --rc: var(--r-partner); --rs: var(--r-partner-soft); }
.role-advisor { --rc: var(--r-advisor); --rs: var(--r-advisor-soft); }
.role-exec { --rc: var(--r-exec); --rs: var(--r-exec-soft); }
.role-investor { --rc: var(--r-investor); --rs: var(--r-investor-soft); }
.role-support { --rc: var(--r-support); --rs: var(--r-support-soft); }

.stage { display: grid; gap: 6px; }
.track { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; }
.track li { height: 6px; border-radius: 2px; background: var(--line); }
.track li.past { background: var(--accent-soft); }
.track li.now { background: var(--accent); }
.track.off li { background: var(--line); }
.track-labels { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; font-size: 11px; color: var(--faint); }
.track-labels span.now { color: var(--accent); font-weight: 700; }
.stage-note { margin: 0; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.off-tag { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; margin-right: 6px; }

.ms { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; font-size: 13px; border-top: 1px dashed var(--line); padding-top: 10px; flex-wrap: wrap; }
.ms .ms-t { min-width: 0; overflow-wrap: anywhere; }
.ms .ms-t small { color: var(--faint); display: block; font-size: 11px; letter-spacing: .04em; }
.ms .ms-d { color: var(--muted); white-space: nowrap; }
.ms .ms-d.late { color: var(--bad); }
.ms .ms-d.soon { color: var(--risk); }

.tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.task { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 3px 0; font-size: 13px; }
.task input { margin: 3px 0 0; accent-color: var(--accent); width: 15px; height: 15px; }
.task label { overflow-wrap: anywhere; cursor: pointer; }
.due { font-family: var(--f-mono); font-size: 11px; color: var(--faint); white-space: nowrap; padding-top: 2px; }
.due.late { color: var(--bad); }
.due.soon { color: var(--risk); }
.more { font-size: 12px; color: var(--faint); padding-left: 23px; }
.no-tasks { font-size: 13px; color: var(--faint); margin: 0; }

.card-f { display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 8px; font-size: 12px; color: var(--faint); }
.card-f .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.card-f .links { display: flex; gap: 4px 12px; flex-wrap: wrap; }
.card-f a { color: var(--accent); text-decoration: none; }
.card-f a:hover { text-decoration: underline; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font-size: 12px; }

/* ---------- merged to-do list (all view) ---------- */
.next { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); display: grid; min-width: 0; }
.next-h { padding: 14px 16px 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.next-h h2 { margin: 0; font-size: 15px; }
.next-h .cnt { font-family: var(--f-mono); font-size: 12px; color: var(--faint); }
.next-list { list-style: none; margin: 0; padding: 0 16px; display: grid; max-height: 60vh; overflow-y: auto; }
.next-list .sec { font-size: 11px; letter-spacing: .06em; color: var(--faint); padding: 10px 0 4px; }
.todo { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); align-items: start; }
.sec + .todo { border-top: 0; }
.todo input { margin: 3px 0 0; accent-color: var(--accent); width: 15px; height: 15px; }
.todo label { cursor: pointer; overflow-wrap: anywhere; font-size: 13px; }
.todo .meta { display: flex; gap: 8px; align-items: center; margin-top: 2px; flex-wrap: wrap; }
.tproj { font-size: 11px; border-radius: 4px; padding: 0 6px; color: var(--rc); background: var(--rs); max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.next-empty { color: var(--faint); font-size: 13px; padding: 4px 0 12px; margin: 0; }
.showall { border: 0; background: none; color: var(--accent); font-size: 12px; padding: 8px 0 4px; text-align: left; }
.quick { border-top: 1px solid var(--line); padding: 12px 16px 14px; display: grid; gap: 8px; }
.quick h3 { margin: 0; font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: .04em; }
.quick-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.field, .quick input, .quick select, .tquick input, .tquick select {
  border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 6px 9px; min-width: 0; width: 100%;
}
.quick button, .tquick button { white-space: nowrap; }

/* ---------- empty / status ---------- */
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); padding: 28px 22px; display: grid; gap: 10px; justify-items: start; }
.empty h3 { margin: 0; font-family: var(--f-display); font-size: 18px; }
.empty p { margin: 0; color: var(--muted); max-width: 52ch; }

/* ---------- editor ---------- */
dialog.editor {
  border: 1px solid var(--line); border-radius: 12px; padding: 0; background: var(--surface); color: var(--ink);
  width: min(720px, calc(100vw - 24px)); max-height: calc(100vh - 32px); box-shadow: 0 20px 60px rgba(0, 0, 0, .25);
}
dialog.editor::backdrop { background: rgba(10, 16, 22, .45); }
.ed { display: grid; max-height: calc(100vh - 34px); }
.ed-h { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.ed-h h2 { margin: 0; font-family: var(--f-display); font-size: 19px; }
.ed-b { padding: 16px 20px; overflow-y: auto; display: grid; gap: 18px; }
.ed-f { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.ed-f .right { display: flex; gap: 8px; margin-left: auto; }
.fs { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; min-width: 0; }
.fs legend, .fl { font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: .04em; padding: 0; margin-bottom: 2px; }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.lf { display: grid; gap: 4px; min-width: 0; }
textarea.field { resize: vertical; min-height: 60px; line-height: 1.5; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.chip span { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; background: var(--surface); }
.chip input:checked + span { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip.role-chip input:checked + span { border-color: var(--rc); background: var(--rs); color: var(--rc); }
.ed-tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.ed-task { display: grid; grid-template-columns: auto minmax(0, 1fr) 140px auto; gap: 8px; align-items: center; }
.ed-task input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
.ed-task .x { border: 0; background: none; color: var(--faint); font-size: 18px; line-height: 1; padding: 2px 6px; }
.ed-task .x:hover { color: var(--bad); }
.ed-err { color: var(--bad); font-size: 13px; margin: 0; }

/* ---------- toast ---------- */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); border-radius: 8px; padding: 9px 14px; font-size: 13px;
  display: flex; gap: 14px; align-items: center; box-shadow: var(--shadow); z-index: 50; max-width: calc(100vw - 32px);
}
.toast button { border: 0; background: none; color: var(--accent-soft); font-weight: 700; padding: 0; }

@media (max-width: 960px) {
  .main, .today-grid { grid-template-columns: minmax(0, 1fr); }
  .next { position: static; order: -1; }
  .next-list { max-height: none; }
  .summary { grid-template-columns: minmax(0, 1fr); }
  .roles { border-left: 0; border-top: 1px solid var(--line); }
}
@media (max-width: 560px) {
  .top h1 { font-size: 24px; }
  .bigdate .d { font-size: 46px; }
  .stat { padding: 12px 14px; min-width: 50%; flex-basis: 50%; }
  .stat + .stat { border-left: 0; }
  .stat:nth-child(even) { border-left: 1px solid var(--line); }
  .stat:nth-child(n+3) { border-top: 1px solid var(--line); }
  .cards { grid-template-columns: minmax(0, 1fr); }
  .row2 { grid-template-columns: minmax(0, 1fr); }
  .ed-task { grid-template-columns: auto minmax(0, 1fr) auto; }
  .ed-task input[type="date"] { grid-column: 2 / 3; }
  .trow { grid-template-columns: auto minmax(0, 1fr) auto; }
  .trow .mini { grid-column: 2 / 3; justify-self: start; }
  .tquick { grid-template-columns: minmax(0, 1fr) auto; }
  .tquick input { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: no-preference) {
  .card { transition: border-color .15s ease; }
  .card:hover { border-color: var(--faint); }
}

<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
  const STAGES = [
    { k: 'idea', l: '构想', d: '还在想，没注册或没真正投入' },
    { k: 'build', l: '筹备', d: '公司已成立，在搭产品、团队、渠道，还没收入' },
    { k: 'launch', l: '起步', d: '开始卖，有第一批客户' },
    { k: 'grow', l: '增长', d: '模式跑通，在放量' },
    { k: 'scale', l: '扩张', d: '加团队、开新市场或新产品线' },
    { k: 'steady', l: '成熟', d: '稳定盈利，重在维持' },
  ];
  const OFF_STAGES = [{ k: 'paused', l: '暂停', d: '' }, { k: 'done', l: '已退出', d: '' }];
  const ALL_STAGES = STAGES.concat(OFF_STAGES);
  const ROLES = [
    { k: 'lead', l: '创始人', d: '我拍板，对结果负全责' },
    { k: 'partner', l: '合伙人', d: '共同经营，各管一块' },
    { k: 'exec', l: '任职', d: '在公司担任职务，按公司方向做事' },
    { k: 'advisor', l: '顾问', d: '给方向和建议，不负责执行' },
    { k: 'investor', l: '股东', d: '出资或持股，看结果' },
    { k: 'support', l: '协助', d: '需要时搭把手' },
  ];
  const FOCUS = [
    { k: 'main', l: '主攻', d: '这段时间的主要精力' },
    { k: 'keep', l: '维持', d: '保持推进，不加码' },
    { k: 'watch', l: '观望', d: '只跟进关键节点' },
  ];
  const HEALTH = [{ k: 'ok', l: '顺利' }, { k: 'risk', l: '有风险' }, { k: 'blocked', l: '卡住' }];
  const WEEK = ['日', '一', '二', '三', '四', '五', '六'];

  const byK = (list, k) => list.find(x => x.k === k);
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const rid = () => Math.random().toString(36).slice(2, 10);
  const nowISO = () => new Date().toISOString();
  const clone = o => JSON.parse(JSON.stringify(o));
  const local = {
    get(k, d) { try { const v = localStorage.getItem('hub:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('hub:' + k, JSON.stringify(v)); } catch {} },
  };

  const hashView = location.hash === '#all' ? 'all' : location.hash === '#today' ? 'today' : null;
  const state = {
    projects: [],
    status: 'loading',          // loading | ready | none | error
    canWrite: true,
    view: hashView || local.get('view', 'today'),
    groupBy: local.get('groupBy', 'stage'),
    showDone: local.get('showDone', false),
    showAllNext: false,
  };
  let DB = null;

  /* ---------- dates ---------- */
  const pad = n => String(n).padStart(2, '0');
  const isoOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const todayISO = () => isoOf(new Date());
  const tomorrowISO = () => { const d = new Date(); d.setDate(d.getDate() + 1); return isoOf(d); };
  function parseISO(iso) {
    if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return null;
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  function daysUntil(iso) {
    const t = parseISO(iso); if (!t) return null;
    const n = new Date(); n.setHours(0, 0, 0, 0);
    return Math.round((t - n) / 86400000);
  }
  function md(iso) { const t = parseISO(iso); return t ? `${t.getMonth() + 1}月${t.getDate()}日` : ''; }
  function dueInfo(iso) {
    const n = daysUntil(iso);
    if (n == null) return null;
    if (n < 0) return { t: `逾期 ${-n} 天`, c: 'late' };
    if (n === 0) return { t: '今天', c: 'soon' };
    if (n === 1) return { t: '明天', c: 'soon' };
    if (n <= 7) return { t: `${n} 天后`, c: 'soon' };
    return { t: md(iso), c: '' };
  }
  function msInfo(iso) {
    const n = daysUntil(iso);
    if (n == null) return null;
    if (n < 0) return { t: `${md(iso)} · 已过 ${-n} 天`, c: 'late' };
    if (n === 0) return { t: `${md(iso)} · 就是今天`, c: 'soon' };
    return { t: `${md(iso)} · 还有 ${n} 天`, c: n <= 14 ? 'soon' : '' };
  }
  function paintDates() {
    const d = new Date();
    $('#today').textContent = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 · 星期${WEEK[d.getDay()]}`;
    $('#td-day').textContent = d.getDate();
    $('#td-month').textContent = `${d.getMonth() + 1}月 · 星期${WEEK[d.getDay()]}`;
    $('#td-week').textContent = d.getFullYear() + '年';
  }

  /* ---------- links: accept "名称 | 网址", "名称：网址" or a bare address ---------- */
  const DOMAIN = /^[\w-]+(\.[\w-]+)*\.[a-z]{2,}(\/\S*)?$/i;
  function normLink(l) {
    let label = String((l && l.label) || '').trim();
    let raw = String((l && l.url) || '').trim();
    if (!raw) return null;
    const generic = !label || label === '链接';
    const m = raw.match(/https?:\/\/\S+/i);
    let url, before = '';
    if (m) { url = m[0]; before = raw.slice(0, m.index); }
    else {
      const parts = raw.split(/[：:]\s*/);
      const last = parts[parts.length - 1].trim();
      if (!DOMAIN.test(last)) return null;
      url = 'https://' + last; before = parts.slice(0, -1).join('：');
    }
    before = before.replace(/[\s：:|]+$/, '').trim();
    if (generic && before) label = before;
    return { label: label || '链接', url };
  }
  function parseLinkLines(text) {
    return text.split('\n').map(line => {
      line = line.trim(); if (!line) return null;
      const i = line.indexOf('|');
      return i >= 0 ? normLink({ label: line.slice(0, i), url: line.slice(i + 1) }) : normLink({ label: '', url: line });
    }).filter(Boolean);
  }

  /* ---------- derived ---------- */
  const isActive = p => p.stage !== 'done';
  const isLive = p => p.stage !== 'done' && p.stage !== 'paused';
  const openTasks = p => (p.tasks || []).filter(t => !t.done);
  const focusRank = k => ({ main: 0, keep: 1, watch: 2 }[k] ?? 3);
  const healthRank = k => ({ blocked: 0, risk: 1, ok: 2 }[k] ?? 3);
  function sortProjects(list) {
    return list.slice().sort((a, b) =>
      (a.stage === 'done') - (b.stage === 'done') ||
      focusRank(a.focus) - focusRank(b.focus) ||
      healthRank(a.health) - healthRank(b.health) ||
      String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
  }
  const taskSortKey = t => { const n = daysUntil(t.due); return n == null ? 1e6 : n; };
  const find = id => state.projects.find(p => p.id === id);
  const roleOf = p => byK(ROLES, p.roleType) || ROLES[0];
  const isTodayTask = t => { const n = daysUntil(t.due); return (n != null && n <= 0) || t.today === todayISO(); };

  /* ---------- render: today ---------- */
  function renderToday() {
    const live = sortProjects(state.projects.filter(isLive));
    const today = todayISO();
    const blocksEl = $('#td-blocks');

    if (state.status !== 'ready') {
      $('#td-count').innerHTML = '';
      $('#td-ms').innerHTML = '';
      blocksEl.innerHTML = state.status === 'loading'
        ? `<div class="today-empty"><h3>正在载入今天的事…</h3><p>会把每家公司今天到期、逾期和你加到今天的待办放在这里。</p></div>`
        : `<div class="today-empty"><h3>暂时连不上数据</h3><p>请在 claude.ai 中登录后打开这个页面。</p></div>`;
      $('#td-soon').innerHTML = ''; $('#td-done').innerHTML = '';
      $('#td-soon-cnt').textContent = ''; $('#td-done-cnt').textContent = '';
      fillProjSelect($('#tq-proj'), live, ['#tq-text', '#tq-proj', '#tq-add']);
      return;
    }

    let nToday = 0, nLate = 0;
    const blocks = live.map(p => {
      const items = openTasks(p).filter(isTodayTask).sort((a, b) => taskSortKey(a) - taskSortKey(b));
      nToday += items.length;
      nLate += items.filter(t => (daysUntil(t.due) ?? 0) < 0).length;
      return { p, items };
    }).filter(b => b.items.length);

    const done = live.flatMap(p => (p.tasks || []).filter(t => t.done && t.doneAt === today).map(t => ({ p, t })));
    const soon = live.flatMap(p => openTasks(p).filter(t => !isTodayTask(t) && (() => { const n = daysUntil(t.due); return n != null && n >= 1 && n <= 3; })()).map(t => ({ p, t })))
      .sort((a, b) => taskSortKey(a.t) - taskSortKey(b.t));

    $('#td-count').innerHTML = `
      <div class="c"><span class="n">${nToday}</span><span class="l">今天要做</span></div>
      <div class="c ${nLate ? 'alert' : ''}"><span class="n">${nLate}</span><span class="l">其中逾期</span></div>
      <div class="c ${done.length ? 'good' : ''}"><span class="n">${done.length}</span><span class="l">今天已完成</span></div>`;

    const ms = live.filter(p => p.milestone && p.milestone.date && (daysUntil(p.milestone.date) ?? -99) >= -3)
      .sort((a, b) => daysUntil(a.milestone.date) - daysUntil(b.milestone.date));
    $('#td-ms').innerHTML = ms.map(p => {
      const mi = msInfo(p.milestone.date);
      return `<span class="ms-chip role-${roleOf(p).k}"><span class="who">${esc(p.name || '未命名')}</span><span class="what">${esc(p.milestone.title || '下一个节点')}</span><span class="when ${mi.c}">${mi.t}</span></span>`;
    }).join('');

    if (!live.length) {
      blocksEl.innerHTML = `<div class="today-empty"><h3>还没有公司</h3><p>先在「全部公司」里添加，再给每家公司加上待办和截止日期。</p></div>`;
    } else if (!blocks.length) {
      blocksEl.innerHTML = `<div class="today-empty"><h3>今天没有到期的事</h3><p>${soon.length ? '可以从右边「接下来 3 天」里挑几件，点「今天做」提前处理。' : '也可以在下面直接加一件今天要做的事。'}</p></div>`;
    } else {
      blocksEl.innerHTML = blocks.map(({ p, items }) => {
        const role = roleOf(p);
        return `<section class="tblock role-${role.k}">
          <div class="tblock-h"><span class="name">${esc(p.name || '未命名')}</span><span class="rtag">${esc(role.l)}</span><span class="cnt">${items.length} 件</span></div>
          <ul class="tlist">${items.map(t => {
            const di = dueInfo(t.due);
            const pinned = !(di && (di.c === 'late' || di.t === '今天')) && t.today === today;
            const id = `td-${p.id}-${t.id}`;
            return `<li class="trow">
              <input type="checkbox" id="${esc(id)}" data-pid="${esc(p.id)}" data-tid="${esc(t.id)}" ${state.canWrite ? '' : 'disabled'}>
              <label for="${esc(id)}">${esc(t.text)}</label>
              ${pinned ? '<span class="pin">今天做</span>' : di ? `<span class="due ${di.c}">${di.t}</span>` : '<span></span>'}
              ${state.canWrite ? `<button class="mini" type="button" data-act="tomorrow" data-pid="${esc(p.id)}" data-tid="${esc(t.id)}">推到明天</button>` : '<span></span>'}
            </li>`;
          }).join('')}</ul>
        </section>`;
      }).join('');
    }

    $('#td-soon-cnt').textContent = soon.length ? `${soon.length} 条` : '';
    $('#td-soon').innerHTML = soon.length ? soon.map(({ p, t }) => {
      const di = dueInfo(t.due);
      return `<li class="srow"><div><div class="t">${esc(t.text)}</div>
        <div class="meta"><span class="tproj role-${roleOf(p).k}">${esc(p.name || '未命名')}</span>${di ? `<span class="due ${di.c}">${di.t}</span>` : ''}</div></div>
        ${state.canWrite ? `<button class="mini" type="button" data-act="today" data-pid="${esc(p.id)}" data-tid="${esc(t.id)}">今天做</button>` : '<span></span>'}
      </li>`;
    }).join('') : '<li class="none">未来 3 天没有到期的待办。</li>';

    $('#td-done-cnt').textContent = done.length ? `${done.length} 件` : '';
    $('#td-done').innerHTML = done.length ? done.map(({ p, t }) => {
      const id = `tx-${p.id}-${t.id}`;
      return `<li class="drow"><input type="checkbox" id="${esc(id)}" data-pid="${esc(p.id)}" data-tid="${esc(t.id)}" checked ${state.canWrite ? '' : 'disabled'} aria-label="取消完成">
        <label for="${esc(id)}">${esc(t.text)} · ${esc(p.name || '')}</label></li>`;
    }).join('') : '<li class="none">勾掉的事会出现在这里，取消勾选可以撤回。</li>';

    fillProjSelect($('#tq-proj'), live, ['#tq-text', '#tq-proj', '#tq-add']);
  }

  /* ---------- render: summary ---------- */
  function renderSummary() {
    const act = state.projects.filter(isActive);
    const tasks = act.flatMap(p => openTasks(p));
    const late = tasks.filter(t => (daysUntil(t.due) ?? 1) < 0).length;
    const week = tasks.filter(t => { const n = daysUntil(t.due); return n != null && n >= 0 && n <= 7; }).length;
    const blocked = act.filter(p => p.health === 'blocked').length;
    const risk = act.filter(p => p.health === 'risk').length;
    const fc = k => act.filter(p => p.focus === k).length;

    const roleCounts = ROLES.map(r => ({ ...r, n: act.filter(p => roleOf(p).k === r.k).length })).filter(r => r.n);
    const total = roleCounts.reduce((s, r) => s + r.n, 0);
    const bar = roleCounts.map(r => `<span style="flex:${r.n};background:var(--r-${r.k})" title="${esc(r.l)} ${r.n}"></span>`).join('');
    const keys = total

    $('#summary').innerHTML = `

        <div class="stat ${late ? 'alert' : ''}"><span class="l">逾期</span><span class="n">${late}</span><span class="sub">${late ? '先处理这些' : '没有逾期'}</span></div>

      </div>`;
  }

  /* ---------- render: company cards ---------- */
  function stageBlock(p) {
    const idx = STAGES.findIndex(s => s.k === p.stage);
    const off = byK(OFF_STAGES, p.stage);
    const cells = STAGES.map((s, i) => `<li class="${idx < 0 ? '' : i < idx ? 'past' : i === idx ? 'now' : ''}"></li>`).join('');
    const labels = STAGES.map((s, i) => `<span class="${i === idx ? 'now' : ''}">${s.l}</span>`).join('');
    const note = p.stageNote ? `<p class="stage-note">${off ? `<span class="off-tag">${off.l}</span>` : ''}${esc(p.stageNote)}</p>`
      : off ? `<p class="stage-note"><span class="off-tag">${off.l}</span></p>` : '';
    return `<div class="stage">
      <ol class="track ${off ? 'off' : ''}" aria-label="阶段：${esc((byK(ALL_STAGES, p.stage) || STAGES[0]).l)}">${cells}</ol>
      <div class="track-labels" aria-hidden="true">${labels}</div>
      ${note}
    </div>`;
  }
  function msBlock(p) {
    const ms = p.milestone || {};
    if (!ms.title && !ms.date) return '';
    const mi = msInfo(ms.date);
    return `<div class="ms"><span class="ms-t"><small>下一个节点</small>${esc(ms.title || '未命名节点')}</span>${mi ? `<span class="ms-d mono ${mi.c}">${mi.t}</span>` : ''}</div>`;
  }
  function taskRow(p, t) {
    const di = dueInfo(t.due);
    const id = `c-${p.id}-${t.id}`;
    return `<li class="task">
      <input type="checkbox" id="${esc(id)}" data-pid="${esc(p.id)}" data-tid="${esc(t.id)}" ${t.done ? 'checked' : ''} ${state.canWrite ? '' : 'disabled'}>
      <label for="${esc(id)}">${esc(t.text)}</label>
      ${di ? `<span class="due ${di.c}">${di.t}</span>` : '<span></span>'}
    </li>`;
  }
  function card(p) {
    const role = roleOf(p);
    const health = byK(HEALTH, p.health) || HEALTH[0];
    const focus = byK(FOCUS, p.focus);
    const open = openTasks(p).sort((a, b) => taskSortKey(a) - taskSortKey(b));
    const doneN = (p.tasks || []).length - open.length;
    const links = (p.links || []).map(normLink).filter(Boolean).slice(0, 8)
      .map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join('');
    const upd = p.updatedAt ? md(String(p.updatedAt).slice(0, 10)) : '';
    return `<article class="card ${p.stage === 'done' ? 'is-done' : ''} ${p.stage === 'paused' ? 'is-paused' : ''}">
      <div class="card-h">
        <div class="card-title">
          <button class="pname" type="button" data-edit="${esc(p.id)}">${esc(p.name || '未命名')}</button>
          <span class="pill h-${health.k}">${health.l}</span>
        </div>
        ${p.tagline ? `<p class="tagline">${esc(p.tagline)}</p>` : ''}
      </div>
      <div class="role role-${role.k}">
        <div class="role-top"><span class="role-type">${role.l}</span><span class="role-name">${esc(p.role || role.d)}</span></div>
        ${p.roleNote ? `<p class="role-note">${esc(p.roleNote)}</p>` : ''}
      </div>
      ${stageBlock(p)}
      ${msBlock(p)}
      ${open.length
        ? `<ul class="tasks">${open.slice(0, 3).map(t => taskRow(p, t)).join('')}</ul>${open.length > 3 ? `<span class="more">还有 ${open.length - 3} 条待办</span>` : ''}`
        : `<p class="no-tasks">${(p.tasks || []).length ? '待办全部完成' : '还没有待办'}</p>`}
      <div class="card-f">
        ${links ? `<div class="links">${links}</div>` : ''}
        <div class="row">
          <span>${focus ? focus.l + ' · ' : ''}${doneN}/${(p.tasks || []).length} 已完成${upd ? ' · ' + upd + '更新' : ''}</span>
          ${state.canWrite ? `<button class="linkbtn" type="button" data-edit="${esc(p.id)}">编辑</button>` : ''}
        </div>
      </div>
    </article>`;
  }
  function renderProjects() {
    const host = $('#projects');
    if (state.status === 'loading') {
      host.innerHTML = `<div class="empty"><h3>正在载入…</h3><p>公司和待办保存在这个页面的云端存储里，几秒内就会出现。</p></div>`;
      return;
    }
    if (state.status === 'none' || state.status === 'error') {
      host.innerHTML = `<div class="empty"><h3>暂时连不上数据</h3><p>请在 claude.ai 中登录后打开这个页面。数据存在云端，换设备打开也能看到。</p></div>`;
      return;
    }
    const list = sortProjects(state.projects.filter(p => state.showDone || p.stage !== 'done'));
    if (!list.length) {
      const hidden = state.projects.length - list.length;
      host.innerHTML = `<div class="empty"><h3>${hidden ? '没有在做的公司' : '还没有公司'}</h3>
        <p>${hidden ? `有 ${hidden} 家已退出的公司被隐藏了，勾选「显示已退出的公司」可以看到。` : '每家公司记下它现在的阶段、你在里面的身份（创始人、合伙人、顾问……）和接下来要做的事。'}</p>
        ${state.canWrite ? '<button class="btn primary" type="button" data-new>＋ 添加第一家公司</button>' : ''}</div>`;
      return;
    }
    let groups;
    if (state.groupBy === 'stage') groups = ALL_STAGES.map(s => ({ l: s.l, hint: s.d, items: list.filter(p => (byK(ALL_STAGES, p.stage) || STAGES[0]).k === s.k) }));
    else if (state.groupBy === 'role') groups = ROLES.map(r => ({ l: r.l, hint: r.d, items: list.filter(p => roleOf(p).k === r.k) }));
    else if (state.groupBy === 'focus') groups = FOCUS.map(f => ({ l: f.l, hint: f.d, items: list.filter(p => p.focus === f.k) }))
      .concat([{ l: '未设置投入度', hint: '', items: list.filter(p => !byK(FOCUS, p.focus)) }]);
    else groups = [{ l: '', hint: '', items: list }];
    host.innerHTML = groups.filter(g => g.items.length).map(g => `
      <section class="group">
        ${g.l ? `<div class="group-h"><h3>${g.l}</h3><span class="cnt">${g.items.length}</span>${g.hint ? `<span class="hint">${g.hint}</span>` : ''}</div>` : ''}
        <div class="cards">${g.items.map(card).join('')}</div>
      </section>`).join('');
  }

  /* ---------- render: merged to-do list ---------- */
  function fillProjSelect(sel, list, controls) {
    const prev = sel.value;
    sel.innerHTML = list.length ? list.map(p => `<option value="${esc(p.id)}">${esc(p.name || '未命名')}</option>`).join('') : '<option value="">先添加一家公司</option>';
    if (prev && list.some(p => p.id === prev)) sel.value = prev;
    const disabled = !state.canWrite || state.status !== 'ready' || !list.length;
    controls.forEach(s => { $(s).disabled = disabled; });
  }
  function renderNext() {
    const listEl = $('#next-list');
    const live = sortProjects(state.projects.filter(isLive));
    const rows = live.flatMap(p => openTasks(p).map(t => ({ p, t })));
    rows.sort((a, b) => taskSortKey(a.t) - taskSortKey(b.t) || focusRank(a.p.focus) - focusRank(b.p.focus));
    $('#next-cnt').textContent = rows.length ? `${rows.length} 条` : '';
    if (state.status !== 'ready') { listEl.innerHTML = `<li class="next-empty">载入后显示所有公司的待办，按截止日期排好。</li>`; }
    else if (!rows.length) { listEl.innerHTML = `<li class="next-empty">没有待办。在公司卡片里或下方加一条。</li>`; }
    else {
      const limit = state.showAllNext ? rows.length : 10;
      const secs = [
        { l: '逾期', f: r => (daysUntil(r.t.due) ?? 1) < 0 },
        { l: '7 天内', f: r => { const n = daysUntil(r.t.due); return n != null && n >= 0 && n <= 7; } },
        { l: '之后', f: r => { const n = daysUntil(r.t.due); return n != null && n > 7; } },
        { l: '没定日期', f: r => daysUntil(r.t.due) == null },
      ];
      let out = '', count = 0;
      for (const s of secs) {
        const items = rows.filter(s.f);
        if (!items.length || count >= limit) continue;
        out += `<li class="sec">${s.l}</li>`;
        for (const { p, t } of items) {
          if (count >= limit) break;
          count++;
          const di = dueInfo(t.due);
          const id = `n-${p.id}-${t.id}`;
          out += `<li class="todo">
            <input type="checkbox" id="${esc(id)}" data-pid="${esc(p.id)}" data-tid="${esc(t.id)}" ${state.canWrite ? '' : 'disabled'}>
            <div><label for="${esc(id)}">${esc(t.text)}</label>
              <div class="meta"><span class="tproj role-${roleOf(p).k}">${esc(p.name || '未命名')}</span>${di ? `<span class="due ${di.c}">${di.t}</span>` : ''}</div>
            </div>
          </li>`;
        }
      }
      if (rows.length > 10) out += `<li><button class="showall" type="button" id="showall">${state.showAllNext ? '收起' : `显示全部 ${rows.length} 条`}</button></li>`;
      listEl.innerHTML = out;
    }
    fillProjSelect($('#q-proj'), live, ['#q-text', '#q-proj', '#q-due', '#q-add']);
  }

  function render() {
    paintDates();
    $('#view-today').hidden = state.view !== 'today';
    $('#view-all').hidden = state.view !== 'all';
    document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === state.view)));
    renderToday();
    renderSummary();
    renderProjects();
    renderNext();
    document.querySelectorAll('#groupby button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.g === state.groupBy)));
    $('#showdone').checked = state.showDone;
    $('#btn-new').hidden = !state.canWrite || state.status !== 'ready';
    $('#ro').hidden = state.canWrite || state.status !== 'ready';
  }

  /* ---------- writes ---------- */
  const queues = {};
  function queueWrite(id, fn) {
    const run = (queues[id] || Promise.resolve()).catch(() => {}).then(fn);
    queues[id] = run;
    return run;
  }
  function errText(e) {
    switch (e && e.code) {
      case 'quota_exceeded': return '存储空间已满：删掉一些旧数据后再试。';
      case 'invalid_argument': return '没能保存：你可能没有这个页面的编辑权限。';
      case 'resource_exhausted': return '操作太快了，等几秒再试。';
      case 'revoked': case 'not_granted': return '页面的数据权限已失效，请刷新页面。';
      default: return '没能保存，请稍后再试。';
    }
  }
  function onWriteError(e) {
    if (e && e.code === 'invalid_argument' && state.canWrite) { state.canWrite = false; render(); }
    toast(errText(e));
  }
  function patchTask(pid, tid, patch) {
    const ref = DB.collection('projects').doc(pid);
    return queueWrite(pid, () => {
      const p = find(pid); if (!p) return;
      const tasks = clone(p.tasks || []).map(t => t.id === tid ? { ...t, ...patch } : t);
      return ref.update({ tasks, updatedAt: nowISO() });
    }).catch(onWriteError);
  }
  const setTask = (pid, tid, done) => patchTask(pid, tid, { done, doneAt: done ? todayISO() : null });
  function addTask(pid, text, due) {
    const ref = DB.collection('projects').doc(pid);
    return queueWrite(pid, () => {
      const p = find(pid); if (!p) return;
      const tasks = clone(p.tasks || []);
      tasks.push({ id: rid(), text, done: false, due: due || null, createdAt: todayISO() });
      return ref.update({ tasks, updatedAt: nowISO() });
    });
  }

  /* ---------- toast ---------- */
  let toastTimer = null;
  function toast(msg, action) {
    const el = $('#toast');
    el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button type="button">${esc(action.label)}</button>` : ''}`;
    if (action) el.querySelector('button').onclick = () => { el.hidden = true; action.run(); };
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, action ? 6000 : 3500);
  }

  /* ---------- editor ---------- */
  const dlg = $('#editor');
  let draft = null, draftIsNew = false, delArmed = null;

  function blankProject() {
    return { name: '', tagline: '', stage: 'build', stageNote: '', roleType: 'lead', role: '', roleNote: '',
      focus: 'keep', health: 'ok', milestone: { title: '', date: '' }, tasks: [], links: [], notes: '' };
  }
  function chipGroup(name, list, val, extraCls) {
    return `<div class="chips">${list.map(o => `
      <label class="chip ${extraCls ? extraCls + ' role-' + o.k : ''}" ${o.d ? `title="${esc(o.d)}"` : ''}>
        <input type="radio" name="${name}" id="${name}-${o.k}" value="${o.k}" ${o.k === val ? 'checked' : ''}><span>${o.l}</span>
      </label>`).join('')}</div>`;
  }
  function edTaskRows() {
    return draft.tasks.map(t => `
      <li class="ed-task" data-tid="${esc(t.id)}">
        <input type="checkbox" id="e-done-${esc(t.id)}" aria-label="已完成" ${t.done ? 'checked' : ''}>
        <input class="field" type="text" id="e-text-${esc(t.id)}" value="${esc(t.text)}" placeholder="待办内容" maxlength="200">
        <input class="field" type="date" id="e-due-${esc(t.id)}" value="${esc(t.due || '')}" aria-label="截止日期">
        <button class="x" type="button" data-rm="${esc(t.id)}" aria-label="删除这条">×</button>
      </li>`).join('');
  }
  function renderEditor() {
    const d = draft;
    $('#ed-title').textContent = draftIsNew ? '添加公司' : '编辑';
    $('#ed-del').hidden = draftIsNew;
    resetDel();
    $('#ed-body').innerHTML = `
      <div class="row2">
        <label class="lf"><span class="fl">名称</span><input class="field" id="f-name" type="text" value="${esc(d.name)}" maxlength="60" placeholder="例如：海外仓"></label>
        <label class="lf"><span class="fl">一句话说明</span><input class="field" id="f-tagline" type="text" value="${esc(d.tagline)}" maxlength="120" placeholder="这家公司做什么"></label>
      </div>

      <fieldset class="fs"><legend>公司现在处于哪个阶段</legend>
        ${chipGroup('f-stage', ALL_STAGES, d.stage)}
        <input class="field" id="f-stageNote" type="text" value="${esc(d.stageNote)}" maxlength="160" placeholder="阶段补充，例如：仓库架构已搭好，等待到货">
      </fieldset>

      <fieldset class="fs"><legend>我在这家公司的身份</legend>
        ${chipGroup('f-roleType', ROLES, d.roleType, 'role-chip')}
        <div class="row2">
          <label class="lf"><span class="fl">具体角色</span><input class="field" id="f-role" type="text" value="${esc(d.role)}" maxlength="60" placeholder="例如：行政，后台"></label>
          <label class="lf"><span class="fl">我负责什么</span><input class="field" id="f-roleNote" type="text" value="${esc(d.roleNote)}" maxlength="200" placeholder="例如：需要时提供支持，特别是语言方面"></label>
        </div>
      </fieldset>

      <div class="row2">
        <fieldset class="fs"><legend>投入度</legend>${chipGroup('f-focus', FOCUS, d.focus)}</fieldset>
        <fieldset class="fs"><legend>状态</legend>${chipGroup('f-health', HEALTH, d.health)}</fieldset>
      </div>

      <fieldset class="fs"><legend>下一个节点</legend>
        <div class="row2">
          <input class="field" id="f-ms-title" type="text" value="${esc((d.milestone || {}).title)}" maxlength="80" placeholder="例如：黑五销售">
          <input class="field" id="f-ms-date" type="date" value="${esc((d.milestone || {}).date || '')}" aria-label="节点日期">
        </div>
      </fieldset>

      <fieldset class="fs"><legend>待办</legend>
        <ul class="ed-tasks" id="ed-tasks">${edTaskRows()}</ul>
        <div><button class="btn" type="button" id="ed-addtask">＋ 加一条待办</button></div>
      </fieldset>

      <label class="lf"><span class="fl">链接（每行一个，例如：官网：1999joias.com）</span>
        <textarea class="field" id="f-links" rows="3" placeholder="后台：https://admin.shopify.com/...">${esc((d.links || []).map(normLink).filter(Boolean).map(l => l.label + '：' + l.url).join('\n'))}</textarea>
      </label>
      <label class="lf"><span class="fl">备注</span>
        <textarea class="field" id="f-notes" rows="3" placeholder="合作方、关键人、要记住的事">${esc(d.notes)}</textarea>
      </label>
      <p class="ed-err" id="ed-err" hidden></p>`;
  }
  function syncTasks() {
    draft.tasks = draft.tasks.map(t => ({
      ...t,
      done: $('#e-done-' + CSS.escape(t.id))?.checked ?? t.done,
      text: ($('#e-text-' + CSS.escape(t.id))?.value ?? t.text).trim(),
      due: $('#e-due-' + CSS.escape(t.id))?.value || null,
    })).map(t => ({ ...t, doneAt: t.done ? (t.doneAt || todayISO()) : null }));
  }
  function readRadio(name, fallback) { const el = document.querySelector(`input[name="${name}"]:checked`); return el ? el.value : fallback; }
  function syncDraft() {
    syncTasks();
    draft.name = $('#f-name').value.trim();
    draft.tagline = $('#f-tagline').value.trim();
    draft.stage = readRadio('f-stage', 'build');
    draft.stageNote = $('#f-stageNote').value.trim();
    draft.roleType = readRadio('f-roleType', 'lead');
    draft.role = $('#f-role').value.trim();
    draft.roleNote = $('#f-roleNote').value.trim();
    draft.focus = readRadio('f-focus', 'keep');
    draft.health = readRadio('f-health', 'ok');
    draft.milestone = { title: $('#f-ms-title').value.trim(), date: $('#f-ms-date').value || '' };
    draft.links = parseLinkLines($('#f-links').value);
    draft.notes = $('#f-notes').value.trim();
    draft.tasks = draft.tasks.filter(t => t.text);
  }
  function openEditor(id) {
    const p = id ? find(id) : null;
    draftIsNew = !p;
    draft = p ? Object.assign(blankProject(), clone(p)) : blankProject();
    if (!Array.isArray(draft.tasks)) draft.tasks = [];
    renderEditor();
    if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
    setTimeout(() => { if (draftIsNew) $('#f-name')?.focus(); }, 30);
  }
  function closeEditor() { if (dlg.open) dlg.close(); draft = null; }
  function resetDel() { clearTimeout(delArmed); delArmed = null; const b = $('#ed-del'); b.classList.remove('armed'); b.textContent = '删除'; }
  function showEdErr(msg) { const el = $('#ed-err'); el.textContent = msg; el.hidden = !msg; }

  $('#ed-body').addEventListener('click', e => {
    const rm = e.target.closest('[data-rm]');
    if (rm) { syncTasks(); draft.tasks = draft.tasks.filter(t => t.id !== rm.dataset.rm); $('#ed-tasks').innerHTML = edTaskRows(); return; }
    if (e.target.closest('#ed-addtask')) {
      syncTasks();
      const t = { id: rid(), text: '', done: false, due: null, createdAt: todayISO() };
      draft.tasks.push(t);
      $('#ed-tasks').innerHTML = edTaskRows();
      $('#e-text-' + CSS.escape(t.id))?.focus();
    }
  });
  $('#ed-form').addEventListener('submit', async e => {
    e.preventDefault();
    if (!draft || !DB) return;
    syncDraft();
    if (!draft.name) { showEdErr('先填名称再保存。'); $('#f-name').focus(); return; }
    const { id, ...data } = draft;
    data.updatedAt = nowISO();
    if (draftIsNew) data.createdAt = data.updatedAt;
    const ref = draftIsNew ? DB.collection('projects').doc() : DB.collection('projects').doc(id);
    const btn = $('#ed-save');
    btn.disabled = true; btn.textContent = '保存中…';
    try {
      await queueWrite(ref.id, () => ref.set(data));
      closeEditor();
      toast(draftIsNew ? '已添加' : '已保存');
    } catch (err) {
      showEdErr(errText(err));
    } finally {
      btn.disabled = false; btn.textContent = '保存';
    }
  });
  $('#ed-del').addEventListener('click', async () => {
    const b = $('#ed-del');
    if (!delArmed) {
      b.classList.add('armed'); b.textContent = '再点一次确认删除';
      delArmed = setTimeout(resetDel, 4000);
      return;
    }
    resetDel();
    const id = draft && draft.id; if (!id) return;
    const name = draft.name;
    try {
      await queueWrite(id, () => DB.collection('projects').doc(id).delete());
      closeEditor();
      toast(`已删除「${name || '未命名'}」`);
    } catch (err) { showEdErr(errText(err)); }
  });
  dlg.addEventListener('click', e => {
    if (e.target.closest('[data-close]')) { closeEditor(); return; }
    if (e.target === dlg) closeEditor();   // backdrop click
  });
  dlg.addEventListener('close', () => { draft = null; });

  /* ---------- page events ---------- */
  document.addEventListener('click', e => {
    const v = e.target.closest('#tabs button');
    if (v) { state.view = v.dataset.view; local.set('view', state.view); render(); return; }
    const ed = e.target.closest('[data-edit]');
    if (ed && state.canWrite) { openEditor(ed.dataset.edit); return; }
    if (e.target.closest('#btn-new, [data-new]')) { openEditor(null); return; }
    const act = e.target.closest('[data-act]');
    if (act && DB) {
      const { pid, tid } = act.dataset;
      if (act.dataset.act === 'tomorrow') { patchTask(pid, tid, { due: tomorrowISO(), today: null }); toast('已改到明天'); }
      if (act.dataset.act === 'today') { patchTask(pid, tid, { today: todayISO() }); toast('已加到今天'); }
      return;
    }
    const g = e.target.closest('#groupby button');
    if (g) { state.groupBy = g.dataset.g; local.set('groupBy', state.groupBy); render(); return; }
    if (e.target.closest('#showall')) { state.showAllNext = !state.showAllNext; renderNext(); }
  });
  document.addEventListener('change', e => {
    const cb = e.target.closest('input[type="checkbox"][data-pid]');
    if (cb && DB) {
      const { pid, tid } = cb.dataset;
      const done = cb.checked;
      setTask(pid, tid, done);
      if (done) {
        const t = (find(pid)?.tasks || []).find(x => x.id === tid);
        toast(`已完成：${t ? t.text : '待办'}`, { label: '撤销', run: () => setTask(pid, tid, false) });
      }
      return;
    }
    if (e.target.id === 'showdone') { state.showDone = e.target.checked; local.set('showDone', state.showDone); render(); }
  });
  async function submitQuick(textSel, projSel, btnSel, due) {
    const text = $(textSel).value.trim();
    const pid = $(projSel).value;
    if (!text || !pid || !DB) { $(textSel).focus(); return false; }
    $(btnSel).disabled = true;
    try {
      await addTask(pid, text, due);
      $(textSel).value = '';
      toast('已添加');
      return true;
    } catch (err) { onWriteError(err); return false; }
    finally { $(btnSel).disabled = !state.canWrite; $(textSel).focus(); }
  }
  $('#quick').addEventListener('submit', async e => {
    e.preventDefault();
    if (await submitQuick('#q-text', '#q-proj', '#q-add', $('#q-due').value)) $('#q-due').value = '';
  });
  $('#t-quick').addEventListener('submit', e => { e.preventDefault(); submitQuick('#tq-text', '#tq-proj', '#tq-add', todayISO()); });

  // a page left open overnight rolls over to the new day
  let lastDay = todayISO();
  setInterval(() => { if (todayISO() !== lastDay) { lastDay = todayISO(); render(); } }, 60000);

  /* ---------- boot ---------- */
  render();
  (async () => {
    if (!window.claude || typeof window.claude.use !== 'function') { state.status = 'none'; render(); return; }
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db) { state.status = 'none'; render(); return; }
    DB = db;
    if (user) { try { if ((await user.can('data.write')) === false) state.canWrite = false; } catch {} }
    db.collection('projects').onSnapshot(snap => {
      state.projects = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      state.status = 'ready';
      render();
    }, err => {
      state.status = 'error';
      render();
      toast(errText(err));
    });
  })();
})();
</script>
